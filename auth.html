<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &amp; Sign Up - Article Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="db.js"></script>
</head>
<body class="authBody">
    <header class="authHeader">
        <div class="headers" id="headerLeft">
            <a href="index.html" class="logoLink" title="Home"><img src="images/logo.png" alt="Logo" id="logo"></a>
        </div>
        <div class="headers" id="headerRight">
            <a href="index.html" class="backHomeBtn">
                &larr; Back to Home
            </a>
        </div>
    </header>

    <main class="authContainer">
        <div class="authCard">
            <!-- Notice Banner (for auth-required redirects or errors) -->
            <div id="authNotice" class="authNotice hidden"></div>

            <!-- Tabs -->
            <div class="authTabs">
                <button type="button" class="authTab active" id="tabSignIn" onclick="switchAuthTab('signin')">Sign In</button>
                <button type="button" class="authTab" id="tabSignUp" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <!-- Header Text -->
            <div class="authHeading">
                <h1 id="authTitle">Welcome back</h1>
                <p id="authSubtitle">Enter your email and password to access your account</p>
            </div>

            <!-- Sign In Form -->
            <form id="formSignIn" class="authForm" onsubmit="handleAuthSubmit(event, 'signin')">
                <div class="formGroup">
                    <label for="signinEmail">Email address <span class="requiredAsterisk">*</span></label>
                    <input type="email" id="signinEmail" placeholder="name@example.com" required autofocus>
                </div>
                <div class="formGroup">
                    <div class="labelRow">
                        <label for="signinPassword">Password <span class="requiredAsterisk">*</span></label>
                        <a href="#" class="forgotLink" onclick="showNotice('Please contact editorial support to reset your password.', false); return false;">Forgot password?</a>
                    </div>
                    <div class="passwordInputWrap">
                        <input type="password" id="signinPassword" placeholder="••••••••" required>
                        <button type="button" class="togglePasswordBtn" onclick="togglePasswordVis('signinPassword', this)" aria-label="Show password" title="Show password" tabindex="-1">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div class="authOptionsRow">
                    <label class="rememberLabel">
                        <input type="checkbox" checked>
                        <span>Remember me for 30 days</span>
                    </label>
                </div>
                <button type="submit" class="authSubmitBtn">Sign In &rarr;</button>
            </form>

            <!-- Sign Up Form (hidden by default) -->
            <form id="formSignUp" class="authForm hidden" onsubmit="handleAuthSubmit(event, 'signup')">
                <div class="formGroup">
                    <label for="signupName">Full name <span class="requiredAsterisk">*</span></label>
                    <input type="text" id="signupName" placeholder="e.g. Ali Mert Bayar" required>
                </div>
                <div class="formGroup">
                    <label for="signupEmail">Email address <span class="requiredAsterisk">*</span></label>
                    <input type="email" id="signupEmail" placeholder="name@example.com" required>
                </div>
                <div class="formGroup">
                    <label for="signupPassword">Create password <span class="requiredAsterisk">*</span></label>
                    <div class="passwordInputWrap">
                        <input type="password" id="signupPassword" placeholder="At least 6 characters" minlength="6" required>
                        <button type="button" class="togglePasswordBtn" onclick="togglePasswordVis('signupPassword', this)" aria-label="Show password" title="Show password" tabindex="-1">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div class="formGroup">
                    <label for="signupConfirmPassword">Confirm password <span class="requiredAsterisk">*</span></label>
                    <div class="passwordInputWrap">
                        <input type="password" id="signupConfirmPassword" placeholder="Repeat your password" minlength="6" required>
                        <button type="button" class="togglePasswordBtn" onclick="togglePasswordVis('signupConfirmPassword', this)" aria-label="Show password" title="Show password" tabindex="-1">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div class="authOptionsRow">
                    <label class="rememberLabel">
                        <input type="checkbox" required>
                        <span>I agree to the Terms of Service & Privacy Policy</span>
                    </label>
                </div>
                <button type="submit" class="authSubmitBtn">Create Account &rarr;</button>
            </form>

            <!-- Bottom Toggle Prompt -->
            <div class="authTogglePrompt">
                <p id="togglePromptText">
                    Don't have an account? 
                    <button type="button" class="toggleAuthModeBtn" onclick="switchAuthTab('signup')">Sign up for free</button>
                </p>
            </div>
        </div>
    </main>

    <footer class="authFooter">
        <p>&copy; 2026 Article Website. All rights reserved.</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const redirectTarget = urlParams.get('redirect') || 'index.html';
        const reason = urlParams.get('reason');

        document.addEventListener('DOMContentLoaded', () => {
            const notice = document.getElementById('authNotice');
            if (reason === 'auth_required') {
                notice.innerHTML = '<strong>Sign-in required:</strong> Please sign in with your email to access the editorial studio.';
                notice.classList.remove('hidden');
                notice.classList.add('infoNotice');
            }
        });

        function switchAuthTab(mode) {
            const tabSignIn = document.getElementById('tabSignIn');
            const tabSignUp = document.getElementById('tabSignUp');
            const formSignIn = document.getElementById('formSignIn');
            const formSignUp = document.getElementById('formSignUp');
            const authTitle = document.getElementById('authTitle');
            const authSubtitle = document.getElementById('authSubtitle');
            const togglePromptText = document.getElementById('togglePromptText');
            hideNotice();

            if (mode === 'signup') {
                tabSignIn.classList.remove('active');
                tabSignUp.classList.add('active');
                formSignIn.classList.add('hidden');
                formSignUp.classList.remove('hidden');

                authTitle.textContent = 'Create an account';
                authSubtitle.textContent = 'Enter your email and details to start publishing';
                togglePromptText.innerHTML = 'Already have an account? <button type="button" class="toggleAuthModeBtn" onclick="switchAuthTab(\'signin\')">Sign in</button>';
                document.getElementById('signupName').focus();
            } else {
                tabSignUp.classList.remove('active');
                tabSignIn.classList.add('active');
                formSignUp.classList.add('hidden');
                formSignIn.classList.remove('hidden');

                authTitle.textContent = 'Welcome back';
                authSubtitle.textContent = 'Enter your email and password to access your account';
                togglePromptText.innerHTML = 'Don\'t have an account? <button type="button" class="toggleAuthModeBtn" onclick="switchAuthTab(\'signup\')">Sign up for free</button>';
                document.getElementById('signinEmail').focus();
            }
        }

        function showNotice(text, isError = true) {
            const notice = document.getElementById('authNotice');
            notice.textContent = text;
            notice.className = 'authNotice ' + (isError ? 'errorNotice' : 'infoNotice');
            notice.classList.remove('hidden');
        }

        function hideNotice() {
            const notice = document.getElementById('authNotice');
            notice.classList.add('hidden');
        }

        function handleAuthSubmit(event, mode) {
            event.preventDefault();
            hideNotice();

            if (mode === 'signup') {
                const name = document.getElementById('signupName').value.trim();
                const email = document.getElementById('signupEmail').value.trim();
                const p1 = document.getElementById('signupPassword').value;
                const p2 = document.getElementById('signupConfirmPassword').value;

                if (p1 !== p2) {
                    showNotice('Passwords do not match. Please verify and retype.');
                    return;
                }

                const result = DB.registerUser({ name, email, password: p1 });
                if (!result.success) {
                    showNotice(result.error || 'Failed to create account.');
                    return;
                }

                // Seamless redirect without window.alert
                window.location.href = redirectTarget;
            } else {
                const email = document.getElementById('signinEmail').value.trim();
                const password = document.getElementById('signinPassword').value;

                const result = DB.loginUser({ email, password });
                if (!result.success) {
                    showNotice(result.error || 'Invalid credentials.');
                    return;
                }

                // Seamless redirect without window.alert
                window.location.href = redirectTarget;
            }
        }

        function togglePasswordVis(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            btn.setAttribute('title', isHidden ? 'Hide password' : 'Show password');
            btn.innerHTML = isHidden
                ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
                : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        }
    </script>
</body>
</html>
